# Nginx site for Medimatch BD (example). Replace medimatch.example.com and the paths.
# HTTPS certificates: sudo certbot --nginx -d medimatch.example.com   (adds the ssl_certificate lines)

server {
    listen 80;
    server_name medimatch.example.com;
    return 301 https://$host$request_uri;          # always use HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name medimatch.example.com;

    root /var/www/medimatch/public;                 # Laravel's public folder only, never the project root
    index index.php;
    charset utf-8;
    client_max_body_size 12M;                       # 4 photos x 2 MB, or a 5 MB prescription, plus form data

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve hidden files (.env, .git, ...)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

# The AI service (127.0.0.1:8001) is deliberately NOT exposed here. Only Laravel talks to it, on the same server.
